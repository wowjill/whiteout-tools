function phaseFor(age){let hit=EVENTS[0];for(const e of EVENTS){if(age-1>=e[0])hit=e;else break}return hit}
function manualStates(){try{return JSON.parse(localStorage.getItem("manualStates")||"{}")}catch{return {}}}
function renderTimeline(age=0,opened=null){let nextSeen=false;$("timeline").innerHTML=EVENTS.map(e=>{const unlocked=age>0&&age-1>=e[0],next=!unlocked&&!nextSeen;if(next)nextSeen=true;const state=unlocked?tr("done"):next?tr("next"):tr("locked");const date=opened?fmtDate(new Date(opened.getTime()+e[0]*DAY)):"";return `<div class="event ${unlocked?"done":next?"next":""}"><span class="event-icon">${ICON[e[1]]}</span><div><div class="event-title">${eventName(e[2])}</div><div class="event-sub">Day ${e[0]}${date?` · ${date}`:""}</div></div><div class="event-state">${state}</div></div>`}).join("")}
function applyLanguage(){document.documentElement.lang=language;$("lang").value=language;const ids={brand:"brand",title:"title",intro:"intro",heroNote:"heroNote",searchTitle:"searchTitle",searchHint:"searchHint",search:"searchBtn",manual:"manualText",save:"saveBtn",age:"ageK",phase:"phaseK",open:"openK",source:"sourceK",updated:"updatedK",next:"nextK",timeline:"timelineTitle",note:"timelineNote",done:"legendDone",locked:"legendLocked",footer:"footer"};for(const [k,id] of Object.entries(ids))$(id).textContent=tr(k);$("legendNext").textContent=tr("next");if(!current){$("status").textContent=tr("wait");renderTimeline()}else showResult(current.state,current.date,current.record,current.local)}
async function getDatabase(){if(database)return database;$("status").textContent=tr("loading");try{const r=await fetch(`./states.json?v=${Date.now()}`);if(!r.ok)throw 0;database=await r.json()}catch{database={_meta:{},states:{}}}return database}
function showResult(state,date,record={},local=false){const age=dayAge(date),phase=phaseFor(age),next=EVENTS.find(e=>age-1<e[0]);current={state,date,record,local};$("manual").classList.add("hidden");$("infoCard").classList.remove("hidden");$("stateV").textContent=`#${state}`;$("precisionBadge").textContent=local?tr("local"):(record.precision==="exact"?tr("exact"):tr("dateOnly"));$("ageV").textContent=tr("day",{n:age});$("phaseV").textContent=eventName(phase[2]);$("openV").textContent=record.precision==="exact"||local?fmtDate(date,true):fmtDate(date);$("sourceV").textContent=local?tr("local"):tr("database");$("updatedV").textContent=local?"—":(record.updated_utc||database?._meta?.updated_utc||"—");if(next){const remaining=Math.max(0,next[0]-(age-1));$("nextCard").classList.remove("hidden");$("nextV").textContent=eventName(next[2]);$("remainingV").textContent=remaining?tr("remaining",{n:remaining}):tr("today");$("nextDateV").textContent=tr("on",{date:fmtDate(new Date(date.getTime()+next[0]*DAY))})}else $("nextCard").classList.add("hidden");renderTimeline(age,date)}
async function lookup(){const state=$("state").value.trim();if(!/^\d{1,5}$/.test(state))return;history.replaceState(null,"",`${location.pathname}?state=${encodeURIComponent(state)}`);$("statusDot").className="dot";const db=await getDatabase(),record=db.states?.[state],saved=manualStates()[state];if(record?.opened_utc){$("status").textContent=tr("found");$("statusDot").className="dot good";showResult(state,new Date(record.opened_utc),record,false)}else if(saved){$("status").textContent=tr("localFound");$("statusDot").className="dot good";showResult(state,new Date(saved),{precision:"exact"},true)}else{$("status").textContent=tr("missing");$("statusDot").className="dot warn";$("manual").classList.remove("hidden");$("infoCard").classList.add("hidden");$("nextCard").classList.add("hidden");current=null;renderTimeline()}}
$("searchBtn").onclick=lookup;$("state").addEventListener("keydown",e=>{if(e.key==="Enter")lookup()});$("saveBtn").onclick=()=>{const state=$("state").value.trim(),d=$("date").value,t=$("time").value||"00:00";if(!state||!d)return;const date=new Date(`${d}T${t}:00Z`),saved=manualStates();saved[state]=date.toISOString();localStorage.setItem("manualStates",JSON.stringify(saved));$("status").textContent=tr("localFound");$("statusDot").className="dot good";showResult(state,date,{precision:"exact"},true)};$("lang").onchange=e=>{language=e.target.value;localStorage.setItem("wosLang",language);applyLanguage()};applyLanguage();const query=new URLSearchParams(location.search).get("state");if(query){$("state").value=query;lookup()}
</script>
</body>
</html>
